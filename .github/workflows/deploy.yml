name: Deploy presentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # VITE_* попадает в публичный JS: нужен только «Ключ сайта» (первая строка в админке reCAPTCHA).
      # «Секретный ключ» в Vite использовать нельзя — он попадёт в бандл и станет доступен всем.
      - name: Build Vite app
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Build Bitrix presentation (wrap in PHP prolog)
        run: python .github/scripts/build_presentation.py

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ALTTECHNO }}" > ~/.ssh/alttechno
          chmod 600 ~/.ssh/alttechno
          ssh-keyscan -p 4422 at5.su >> ~/.ssh/known_hosts

      - name: Deploy to alttechno.ru
        run: |
          ssh -i ~/.ssh/alttechno -p 4422 bitrix@at5.su \
            "mkdir -p /home/bitrix/www/local/presentations/power_system_zapolyarye"
          scp -i ~/.ssh/alttechno -P 4422 -r deploy/* \
            bitrix@at5.su:/home/bitrix/www/local/presentations/power_system_zapolyarye/
          scp -i ~/.ssh/alttechno -P 4422 www/urlrewrite.php \
            bitrix@at5.su:/home/bitrix/www/urlrewrite.php
