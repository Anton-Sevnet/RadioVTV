<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#f97316"/>
  <!-- Antenna -->
  <line x1="256" y1="180" x2="420" y2="80" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
  <circle cx="420" cy="80" r="12" fill="#fff"/>
  <!-- Radio Body -->
  <rect x="80" y="180" width="352" height="220" rx="24" fill="#fff"/>
  <!-- Speaker Grill -->
  <circle cx="160" cy="290" r="60" fill="#f97316"/>
  <circle cx="160" cy="290" r="40" fill="#fff" stroke="#f97316" stroke-width="10"/>
  <!-- Tuning Dial -->
  <rect x="260" y="210" width="140" height="60" rx="10" fill="#fed7aa"/>
  <line x1="300" y1="210" x2="300" y2="270" stroke="#f97316" stroke-width="6"/>
  <!-- Knobs -->
  <circle cx="290" cy="330" r="24" fill="#f97316"/>
  <circle cx="370" cy="330" r="24" fill="#f97316"/>
</svg>